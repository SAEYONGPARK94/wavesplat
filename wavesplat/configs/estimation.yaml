# WaveSplat Estimation Configuration
# Usage: python -m wavesplat.run --episode data/episode.h5 --config configs/estimation.yaml

# ── Model ───────────────────────────────────────────────────────────────────
model:
  n_gaussians: [3, 8, 15]    # coarse-to-fine stages
  depth: 50.0                 # water depth [m] (overridden by episode metadata)

# ── Optimizer ───────────────────────────────────────────────────────────────
optimizer:
  lr: 0.01                    # base learning rate (kx/ky get 0.5×)
  lambda_l1: 0.0001           # L1 sparsity weight on amplitudes.
                              # 1e-3 -> 1e-4 on 2026-08-11 (S9, prereg BOTH verdict):
                              # sparse 50/64 -33.0% (p 7e-6), crowded 27/32 -9.9%; all 9
                              # distance shells improved, 0 worsened; GT-free sensor
                              # residual improved in both regimes. See
                              # tmp/S9_lr_x_l1_2026-08-11/RESULT.md
                              # SINGLE SOURCE (since 5f0846c, 2026-08-12): the value is
                              # defined ONCE in
                              # wavesplat/optimizer/sequential_update.py:40
                              # (LAMBDA_L1_DEFAULT). run.py:30 IMPORTS that name into
                              # DEFAULT_CONFIG, and run.py:94 makes the yaml-loader
                              # fallback read DEFAULT_CONFIG rather than a hand-written
                              # third copy. THIS yaml key is a MIRROR: it is the only
                              # copy that can go stale, and it only takes effect when
                              # this file is passed via --config.
                              # (The old "Keep in sync" note described the pre-5f0846c
                              #  three-copy layout and was retracted 2026-08-13.)
  lambda_smooth: 0.0001       # spectral smoothness weight
  # VARPRO 배포 2026-08-22 — 유일 정의는 optimizer/sequential_update.py 의
  # VARPRO_STEPS_DEFAULT / LEARNED_INIT_ITERS_DEFAULT 다. 이 두 줄은 미러다.
  # 근거: W4 1,344런 · W5 640런 · B 1,152런(배포 라우터 ITT, 혼잡 -25.28%).
  varpro_steps: 400           # ⛔0 하나로는 배포 전 거동이 아니다 (아래와 함께 바꿀 것)
  learned_init_iters: 0       # W5 가 결합 경사하강을 잉여로 측정 (이전 500).
                              # ★배포 전 거동 = varpro_steps:0 AND learned_init_iters:500.
                              # 한쪽만 끄면 W4 의 L-ITER0 = 배포 전보다 나쁘다(7/64, +23.34%).
  tracking_steps: 10          # gradient steps per tracking frame
  tracking_mode: w_phi         # 'phi_only', 'w_phi', or 'all'
  tracking_lr: 0.005          # learning rate for tracking phase
  init_method: auto            # 'auto' (GT-free router on the learned proposal's n_selected,
                               #  threshold 8; beamform guard RETIRED 2026-07-27; routed to
                               #  real_estimator on real GT-free input), 'v1' (FFT),
                               #  'v2' (beamform+proj), 'v2_konly' (beamform kx/ky),
                               #  'learned' (cond-diffusion set-proposal)
  analytic_ensemble_k: 3      # median-of-k field ensemble on the ANALYTIC fallback of the
                               #  'auto' router only (1 = off). Explicit init_method: v2_konly
                               #  is never ensembled, so published numbers are unaffected.
  real_estimator: bank_mmse   # what the REAL-DOMAIN gate routes to (2026-07-29 port):
                               #  'bank_mmse' = ported research estimator, observation-only
                               #  parameters, ~2x better on the frozen real windows;
                               #  'v2_konly' = pre-port single-run fallback (escape hatch).

  # Rolling re-fit period (s) for the bank_mmse route.  null = the shipping behaviour:
  # fit once, then freeze.  Exposed 2026-08-20 (D batch) -- the implementation has
  # existed since the 2026-07-29 port but was reachable from NO config surface, so the
  # measured winner had no deployed path (second instance of the learned_merge_frac
  # pattern).  On the 9 frozen real windows of rolling_refit.json: frozen 0.9452 vs
  # refit@2s 0.7932, 8/9 windows and 3/3 records lower, and the pre-run adoption
  # protocol selects R*=2s alone.  DESCRIPTIVE only -- 5 independent real records give an
  # exact one-sided binomial floor of 0.03125 -- so the default is left UNCHANGED.
  bank_refit_every_s: null
  real_bank_ensemble_k: 3     # members of the bank-MMSE pointwise-median field ensemble
                               #  (fit seeds {s, s+1000, s+2000}); 1 = off.
  max_steepness: 0.15         # wave steepness clamp ε = |k|·|w|

# ── Physics Constraints ────────────────────────────────────────────────────
physics:
  use_dispersion: true        # enforce ω = √(g|k|tanh(|k|d))
  use_confidence: true        # geometry-aware confidence weighting

# ── Adaptive N ─────────────────────────────────────────────────────────────
adaptive:
  adaptive_n: true            # enable prune/grow
  prune_threshold: 0.10       # energy fraction for pruning (keep top 90%)
  grow_residual_threshold: 0.05  # residual RMS to trigger growth [m]
  max_n: 30                   # maximum Gaussians

# ── Coarse-to-Fine Schedule ─────────────────────────────────────────────────
schedule:
  loss_thresholds: [0.1, 0.05, null]    # advance when loss < threshold
  max_iters_per_stage: [200, 200, 500]  # max iterations per stage

# ── Initialization ──────────────────────────────────────────────────────────
init:
  tp_factor: 2.0              # initialization window = tp_factor × Tp
  grid_nx: 32                 # FFT binning resolution (x)
  grid_ny: 24                 # FFT binning resolution (y)

# ── Tracking ────────────────────────────────────────────────────────────────
tracking:
  tracking_window: 3          # sliding window for multi-frame tracking

# ── Evaluation ──────────────────────────────────────────────────────────────
eval:
  converge_threshold: 0.05    # nRMSE threshold for convergence time
  split_distance: 80.0        # near/far boundary [m]
  unobserved_min_dist: 10.0   # min distance from obs for unobserved RMSE [m]

# ── Runtime ─────────────────────────────────────────────────────────────────
device: cpu                   # 'cpu' or 'cuda'
seed: 42
